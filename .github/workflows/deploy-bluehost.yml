name: Deploy to Bluehost (mts-analytics)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.BLUEHOST_SSH_HOST }}
      SSH_USER: ${{ secrets.BLUEHOST_SSH_USER }}
      SSH_KEY: ${{ secrets.BLUEHOST_SSH_KEY }}
      TARGET_DIR: ${{ secrets.BLUEHOST_TARGET_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js site (static export)
        run: |
          npm run build
          # With output: 'export' in next.config.js, Next.js writes static files to ./out
          test -d out || (echo "out/ folder not found after build" && exit 1)

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/bluehost_deploy_ed25519
          chmod 600 ~/.ssh/bluehost_deploy_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via rsync over SSH
        run: |
          rsync -avz --delete \
            out/ \
            "$SSH_USER@$SSH_HOST:$TARGET_DIR/"
        env:
          RSYNC_RSH: "ssh -i ~/.ssh/bluehost_deploy_ed25519 -o StrictHostKeyChecking=yes"